<row class="price-card list-style-none w-100">
  <columns small="14" large="6">
    <div class="price-card__alert">
      <p class="m-0 text text--small" style="margin: 0 !important;">
        <!--name--><span class="m-span text-secondary">
          <!--symbol--></span>is up
        <span class="m-span text-success">
          <!--percent format--></span> to
        last 24h
      </p>
    </div>
  </columns>
  <columns small="14" large="6">
    <row class="footer">
      <columns small="9" large="9">
        <row>
          <columns small="3" large="3">
            <center>
              <!--img percent-->
              <img class="mr-1 icon" width="16" height="16" style="width: 16px; height: 16px;  min-width: 16px;"
                src="http://cryptometric-api.groupbwt.com/email/percentup.png" alt="Increase">
            </center>
          </columns>
          <columns small="11" large="11">
            <p class="m-0 text text--small" style="text-align: left;white-space: nowrap;">
              <!--price format-->
          </columns>
        </row>
      </columns>
      <columns small="5" large="5">
        <row class="text" style="color: #9ea8b0; margin-left: 18px;">
          <columns small="3" large="3">
            <center>
              <!--img calendar-->
              <img class="mr-1 icon" width="16" height="16"
                style="width: 16px; height: 16px;min-width: 16px;min-height: 16px;"
                src="http://cryptometric-api.groupbwt.com/email/calendar.png" alt="Calendar">
            </center>
          </columns>
          <columns small="6" large="6">
            <center>
              <p class="m-0 text text--small text-nowrap text-secondary" style="text-align: left;">
                <!--date format-->
              </p>
            </center>
          </columns>
        </row>
      </columns>
    </row>
  </columns>
</row>
<hr class="m-0" style="height: 1px; border: none; width: 100%;" color="#DFE8EF" />
