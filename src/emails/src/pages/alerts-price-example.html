<container>
  <row>
    <columns large="1">
    </columns>
    <columns large="12" small="14">
      <spacer size="28"></spacer>
      <h1 style="color: #1A1A1A;" class="text-center text text-bold m-0 text--tittle">The prices of traceable coins
        have changed!</h1>
      <spacer size="22"></spacer>
      <hr class="m-0" style="height: 1px; border: none; width: 100%;" color="#DFE8EF" />
      <ul class="p-0 m-0">
        {{#each price}}
        {{#ifequal this.alert_type 1}}
        {{> price-card-increase-example data=this}}
        {{/ifequal}}
        {{#ifequal this.alert_type 2}}
        {{> price-card-decrease-example data=this}}
        {{/ifequal}}
        {{/each}}
      </ul>
      <spacer size="24"></spacer>
      <center>
        <button href="{{links.news}}" class="expanded text radius">Click for more alerts!</button>
      </center>
    </columns>
    <columns large="1">
    </columns>
  </row>
</container>
