<container>
  <row>
    <columns large="1">
    </columns>
    <columns large="12" small="14">
      <spacer size="28"></spacer>
      <h1 style="color: #1A1A1A;" class="text-center text text-bold m-0 text--tittle">The prices of traceable coins
        have changed!</h1>
      <spacer size="8"></spacer>
      <hr class="m-0" style="height: 1px; border: none;" color="#DFE8EF">
      <ul class="p-0 m-0">
        <!--Example card increase -->
        {{> price-card-increase}}
        <!-- /Example card increase -->
        <!--Example card decrease -->
        {{> price-card-decrease}}
        <!-- /Example card decrease -->
      </ul>
      <spacer size="24"></spacer>
      <center>
        <!--Link button <button href="link"-->
        <button href="link" class="expanded text radius media-text">Click for more alerts!</button>
      </center>
    </columns>
    <columns large="1">
    </columns>
  </row>
</container>
