<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#01B7FF" />

  <title>Cryptometric</title>

  <link rel="icon" href="<%= BASE_URL %>favicon/favicon.svg" type="image/svg+xml" />
  <link rel="mask-icon" href="<%= BASE_URL %>favicon/favicon.svg" color="#01B7FF" />
  <link rel="manifest" href="<%= BASE_URL %>manifest.json" />
  <style>
    /* Affects only safari 10.1+ (ugly hack) */
    @media not all and (min-resolution: 0.001dpcm) {

      @media {
        body .header-dashboard {
          padding-right: calc(33px + env(safe-area-inset-right));
          width: calc(100% - 78px - env(safe-area-inset-left));
        }

        body .dashboard__main.is-sidebar {
          padding-left: calc(285px + env(safe-area-inset-left));
        }

        @media (max-width: 1199.98px) {
          body .filter-sidebar.is-active .filter-sidebar__content {
            padding-right: calc(15px + env(safe-area-inset-right));
          }

          body .header-dashboard.is-sidebar {
            width: calc(100% - 78px - env(safe-area-inset-left));
          }
        }

        @media (max-width: 991.98px) {
          body .dashboard__main.is-sidebar {
            padding-left: calc(108px + env(safe-area-inset-left));
          }
        }

        @media (max-width: 991.98px) and (min-width: 768px) {
          body .side-bar {
            padding-left: env(safe-area-inset-left);
          }

          body .side-bar.is-sidebar {
            width: calc(78px + env(safe-area-inset-left));
          }
        }

        @media (max-width: 767.98px) {
          body .header-dashboard.is-sidebar {
            width: calc(100% - 78px - env(safe-area-inset-left) - env(safe-area-inset-right));
          }

          body .dashboard__main.is-sidebar {
            padding-left: calc(30px + env(safe-area-inset-left));
          }
        }

        @media (max-width: 575.98px) {
          body .header-dashboard.is-sidebar {
            width: 100%;
          }

          body .dashboard__main.is-sidebar {
            padding-left: calc(10px + env(safe-area-inset-left));
          }
        }

        @media (max-width: 500px) {
          body .header-dashboard {
            padding-right: calc(15px + env(safe-area-inset-right));
          }
        }
      }
    }

  </style>
</head>

<body>
  <noscript>
    <strong>We're sorry but Cryptometric doesn't work properly without JavaScript enabled. Please enable it to
      continue.</strong>
  </noscript>
  <div id="app"></div>
  <div id="teleport"></div>
  <!-- built files will be auto injected -->
</body>

</html>
